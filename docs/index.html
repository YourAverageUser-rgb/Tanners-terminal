<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanner's Terminal</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/brython@3.9.5/brython.min.js"></script>
    <style>
        body {
            background-color: black;
            color: limegreen;
            font-family: monospace;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        .launcher {
            padding: 30px 20px 10px;
            text-align: center;
            border-bottom: 1px solid #093;
        }
        .launcher h1 {
            margin: 0 0 6px;
            font-size: 28px;
            color: white;
            letter-spacing: 2px;
            font-family: "Segoe UI", system-ui, sans-serif;
        }
        .launcher p {
            margin: 0 0 18px;
            color: #9aa4b2;
            font-family: "Segoe UI", system-ui, sans-serif;
            font-size: 14px;
        }
        .launcher .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .launch-btn {
            display: inline-flex; align-items: center; gap: 10px;
            background: #107C10;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-family: "Segoe UI", system-ui, sans-serif;
            font-size: 15px;
            box-shadow: 0 6px 20px rgba(22,198,12,0.3);
            transition: transform .15s, background .15s;
        }
        .launch-btn:hover { background: #16c60c; transform: translateY(-2px); }
        .launch-btn.ghost {
            background: rgba(255,255,255,0.06);
            color: #c8f4c8;
            box-shadow: none;
        }
        .launch-btn .orb {
            width: 22px; height: 22px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #1be11b, #0d6b0d);
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 13px; color: white;
        }
        .terminal-wrap { padding: 20px; max-width: 1000px; margin: 0 auto; }
        #terminal {
            white-space: pre-wrap;
            margin-bottom: 10px;
            height: 60vh;
            overflow-y: auto;
            border: 1px solid #093;
            padding: 12px;
            border-radius: 4px;
        }
        input {
            background-color: black;
            color: limegreen;
            border: 1px solid #093;
            font-family: monospace;
            width: 100%;
            padding: 10px;
            outline: none;
            font-size: 18px;
            border-radius: 4px;
        }
    </style>
</head>
<body onload="brython()">
    <div class="launcher">
        <h1>TANNER'S TERMINAL</h1>
        <p>Web terminal · Xbox-style PC dashboard · all in one place</p>
        <div class="btns">
            <a class="launch-btn" href="xbox.html"><span class="orb">X</span> Launch Xbox Dashboard</a>
            <a class="launch-btn ghost" href="autostart.html">⚙ PC Autostart Guide</a>
        </div>
    </div>

    <div class="terminal-wrap">
        <div id="terminal"></div>
        <form id="commandForm" onsubmit="return false;">
            <input type="text" id="commandInput" placeholder="Enter command... try 'help'" autocomplete="off" />
        </form>
    </div>

    <script type="text/python">
        from browser import document, window
        import random, base64

        if not hasattr(window, 'terminal_initialized'):
            window.terminal_initialized = True

            terminal = document["terminal"]

            LIME_GREEN = "<span style='color:limegreen;'>"
            RESET_COLOR = "</span>"

            def animated_typing(message):
                terminal.innerHTML += message

            encrypted_jokes = base64.b64encode("Why do programmers prefer dark mode? Because the light attracts bugs!|There are 10 types of people in the world: those who understand binary and those who don't.|How many programmers does it take to change a lightbulb? None, that's a hardware problem!".encode()).decode()

            def joke():
                jokes = decrypt_data(encrypted_jokes).split('|')
                terminal.innerHTML += f"{LIME_GREEN}{random.choice(jokes)}{RESET_COLOR}\n"

            def decrypt_data(encoded_string):
                return base64.b64decode(encoded_string).decode()

            def handle_command(event):
                command = document["commandInput"].value.strip().lower()
                document["commandInput"].value = ""

                if command == "help":
                    terminal.innerHTML += f"{LIME_GREEN}Commands: help, joke, xbox, autostart, clear, exit{RESET_COLOR}\n"
                elif command == "joke":
                    joke()
                elif command == "xbox":
                    terminal.innerHTML += f"{LIME_GREEN}Booting Xbox dashboard...{RESET_COLOR}\n"
                    window.location.href = "xbox.html"
                elif command == "autostart":
                    terminal.innerHTML += f"{LIME_GREEN}Opening PC autostart guide...{RESET_COLOR}\n"
                    window.location.href = "autostart.html"
                elif command == "clear":
                    terminal.innerHTML = ""
                elif command == "exit":
                    terminal.innerHTML += f"{LIME_GREEN}Goodbye!{RESET_COLOR}\n"
                else:
                    terminal.innerHTML += f"{LIME_GREEN}Unknown command. Type 'help'.{RESET_COLOR}\n"

                terminal.scrollTop = terminal.scrollHeight

            def on_enter(event):
                if event.keyCode == 13:
                    event.preventDefault()
                    handle_command(event)

            document["commandInput"].bind("keydown", on_enter)

            animated_typing("Welcome to Tanner's Terminal! Type 'help' for commands, or 'xbox' to boot the dashboard.\n")
    </script>
</body>
</html>
